<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Source-grounded LLM API workflow with validation and reproducibility</title>
  <desc id="desc">A notebook sends a source and task through OpenRouter to a model, receives a JSON response, validates claims against evidence, and saves a reproducibility record. Error analysis loops back to the prompt and schema.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#edf5f3"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2c6674"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b07d16"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg2)"/>
  <text x="54" y="62" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">From cultural source to auditable claim</text>
  <text x="54" y="94" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#496477">The API automates transport and logging; source checks and research judgment remain human responsibilities.</text>

  <g filter="url(#shadow2)">
    <rect x="48" y="146" width="190" height="174" rx="18" fill="#ffffff" stroke="#82aeb7" stroke-width="2"/>
    <text x="72" y="181" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">1 · NOTEBOOK</text>
    <rect x="72" y="207" width="142" height="34" rx="8" fill="#d9eff1"/>
    <text x="143" y="229" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#24515c">source text</text>
    <rect x="72" y="249" width="142" height="34" rx="8" fill="#f9e6b4"/>
    <text x="143" y="271" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#6c4b08">task + constraints</text>
    <text x="72" y="305" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#496477">Key entered privately</text>
  </g>

  <path d="M246 233 H300" stroke="#2c6674" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="312" y="146" width="190" height="174" rx="18" fill="#ffffff" stroke="#82aeb7" stroke-width="2"/>
    <text x="336" y="181" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">2 · REQUEST</text>
    <text x="336" y="218" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#24515c">POST /chat/...</text>
    <text x="336" y="249" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#24515c">{ model,</text>
    <text x="336" y="272" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#24515c">  messages,</text>
    <text x="336" y="295" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#24515c">  token_limit }</text>
  </g>

  <path d="M510 233 H564" stroke="#2c6674" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="576" y="146" width="190" height="174" rx="18" fill="#ffffff" stroke="#82aeb7" stroke-width="2"/>
    <text x="600" y="181" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">3 · ROUTING</text>
    <circle cx="671" cy="236" r="42" fill="#17324d"/>
    <text x="671" y="232" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">OpenRouter</text>
    <text x="671" y="251" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#dbe8ee">gateway</text>
    <text x="600" y="303" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#496477">Provider policy matters</text>
  </g>

  <path d="M774 233 H828" stroke="#2c6674" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="840" y="146" width="312" height="174" rx="18" fill="#ffffff" stroke="#82aeb7" stroke-width="2"/>
    <text x="864" y="181" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">4 · JSON RESPONSE</text>
    <text x="864" y="215" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#24515c">{ id, model, choices,</text>
    <text x="864" y="238" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#24515c">  usage, finish_reason, ... }</text>
    <line x1="864" y1="257" x2="1124" y2="257" stroke="#d8e4e8"/>
    <text x="864" y="282" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#496477">Generated text + machine metadata</text>
    <text x="864" y="303" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#496477">Requested model may differ from returned model</text>
  </g>

  <path d="M996 328 V380" stroke="#2c6674" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="672" y="392" width="480" height="154" rx="18" fill="#ffffff" stroke="#d6ad4b" stroke-width="2"/>
    <text x="700" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#6c4b08">5 · VALIDATE AGAINST THE SOURCE</text>
    <text x="700" y="461" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#496477">Does each claim have exact evidence? What is missing or invented?</text>
    <text x="700" y="487" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#496477">Evaluate a sample with human labels or a ground truth—not model agreement.</text>
    <rect x="700" y="505" width="126" height="25" rx="12" fill="#e6f4ec"/><text x="763" y="522" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#24633f">SUPPORTED</text>
    <rect x="835" y="505" width="150" height="25" rx="12" fill="#fff1ce"/><text x="910" y="522" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#7a5510">PARTIAL</text>
    <rect x="994" y="505" width="130" height="25" rx="12" fill="#f9dddd"/><text x="1059" y="522" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#7d3131">UNSUPPORTED</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="48" y="392" width="514" height="154" rx="18" fill="#17324d"/>
    <text x="76" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">6 · SAVE A REPRODUCIBILITY RECORD</text>
    <text x="76" y="461" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#dbe8ee">timestamp · endpoint · requested/returned model · prompts</text>
    <text x="76" y="487" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#dbe8ee">source hash · parameters · usage · output · software versions</text>
    <text x="76" y="519" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#f9e6b4">Never store the API key in the record.</text>
  </g>

  <path d="M664 469 H570" stroke="#2c6674" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <path d="M760 554 C610 602 365 600 211 553 C119 525 98 361 310 335" stroke="#b07d16" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrowGold)"/>
  <text x="360" y="587" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a6314">Error analysis → revise the task, evidence rule, or sampling plan</text>
</svg>
